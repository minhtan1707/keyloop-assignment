services:
  postgres:
    image: postgres:16-alpine
    container_name: keyloop-scheduler-db
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: service_scheduler
    ports:
      - '5432:5432'
    volumes:
      - scheduler_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d service_scheduler']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - scheduler_net

  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyloop-scheduler-api-1
    environment: &api_env
      PORT: 3000
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: scheduler
      DATABASE_PASSWORD: scheduler
      DATABASE_NAME: service_scheduler
      DATABASE_SYNC: 'true'
      SEED_ON_BOOT: 'true'
      JWT_SECRET: keyloop-scheduler-dev-secret
      JWT_EXPIRES_IN: 8h
      REPLICA_ID: api-1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          'http://127.0.0.1:3000/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - scheduler_net

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyloop-scheduler-api-2
    environment:
      <<: *api_env
      DATABASE_SYNC: 'false'
      SEED_ON_BOOT: 'false'
      REPLICA_ID: api-2
    depends_on:
      postgres:
        condition: service_healthy
      api-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          'http://127.0.0.1:3000/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - scheduler_net

  api-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyloop-scheduler-api-3
    environment:
      <<: *api_env
      DATABASE_SYNC: 'false'
      SEED_ON_BOOT: 'false'
      REPLICA_ID: api-3
    depends_on:
      postgres:
        condition: service_healthy
      api-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          'http://127.0.0.1:3000/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - scheduler_net

  api-4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyloop-scheduler-api-4
    environment:
      <<: *api_env
      DATABASE_SYNC: 'false'
      SEED_ON_BOOT: 'false'
      REPLICA_ID: api-4
    depends_on:
      postgres:
        condition: service_healthy
      api-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          'http://127.0.0.1:3000/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - scheduler_net

  nginx:
    image: nginx:1.27-alpine
    container_name: keyloop-scheduler-nginx
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      api-3:
        condition: service_healthy
      api-4:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - scheduler_net

volumes:
  scheduler_pg_data:

networks:
  scheduler_net:
    driver: bridge
