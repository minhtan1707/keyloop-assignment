upstream scheduler_api {
    # Prefer the replica with fewest active connections — better under uneven load
    # than round-robin when some booking requests hold DB locks longer than others.
    least_conn;
    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
    server api-3:3000 max_fails=3 fail_timeout=10s;
    server api-4:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    location /nginx-health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Close upstream connections so demo traffic is not pinned by keepalive.
        proxy_set_header Connection "close";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://scheduler_api;
    }
}
